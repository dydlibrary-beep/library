<!DOCTYPE html>
<html>
<head>
  <base target="_top">

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      padding:24px;
      background:#f3f4f6;
      font-family:'Inter',sans-serif;
      color:#111827;
    }

    .container{

      width:100%;
      max-width:460px;

      margin:auto;

      background:#ffffff;

      border-radius:18px;

      padding:28px;

      box-shadow:
        0 10px 25px rgba(0,0,0,0.08),
        0 2px 6px rgba(0,0,0,0.04);

      border:1px solid #e5e7eb;
    }

    .title{

      display:flex;
      align-items:center;
      gap:10px;

      font-size:20px;
      font-weight:600;

      margin-bottom:22px;

      color:#111827;
    }

    .subtitle{

      font-size:13px;
      color:#6b7280;

      margin-top:-12px;
      margin-bottom:22px;
    }

    label{

      display:block;

      font-size:14px;
      font-weight:600;

      margin-bottom:8px;

      color:#374151;
    }

    input{

      width:100%;

      padding:12px 14px;

      border:1px solid #d1d5db;

      border-radius:12px;

      font-size:14px;

      outline:none;

      transition:all .2s ease;

      margin-bottom:18px;
    }

    input:focus{

      border-color:#2563eb;

      box-shadow:
        0 0 0 4px rgba(37,99,235,0.10);
    }

    .helper{

      font-size:12px;
      color:#6b7280;

      margin-top:-10px;
      margin-bottom:18px;
    }

    .buttons{

      display:flex;

      justify-content:flex-end;

      gap:12px;
    }

    button{

      border:none;

      border-radius:12px;

      padding:11px 18px;

      font-size:14px;
      font-weight:600;

      cursor:pointer;

      transition:all .2s ease;
    }

    .cancel{

      background:#f3f4f6;
      color:#374151;
    }

    .cancel:hover{
      background:#e5e7eb;
    }

    .save{

      background:#2563eb;
      color:white;
    }

    .save:hover{
      background:#1d4ed8;
    }

    .save:disabled{

      opacity:.6;
      cursor:not-allowed;
    }

    .loader{

      display:none;

      margin-top:18px;

      font-size:13px;

      color:#2563eb;

      font-weight:500;
    }

    .toast{

      margin-top:18px;

      padding:12px 14px;

      border-radius:12px;

      font-size:13px;

      font-weight:500;

      display:none;
    }

    .toast.success{

      background:#dcfce7;
      color:#166534;
    }

    .toast.error{

      background:#fee2e2;
      color:#991b1b;
    }

    @media(max-width:520px){

      body{
        padding:16px;
      }

      .container{
        padding:22px;
      }

      .buttons{
        flex-direction:column;
      }

      button{
        width:100%;
      }
    }

  </style>
</head>

<body>

  <div class="container">

    <div class="title">
      📬 Set Tracking ID
    </div>

    <div class="subtitle">
      Update India Post tracking number for the selected order.
    </div>

    <label for="trackingId">
      Tracking ID
    </label>

    <input
      type="text"
      id="trackingId"
      placeholder="Example: EF123456789IN"
      autocomplete="off"
    >

    <div class="helper">
      Enter valid India Post tracking number.
    </div>

    <div class="buttons">

      <button
        class="cancel"
        onclick="google.script.host.close()"
      >
        Cancel
      </button>

      <button
        id="saveBtn"
        class="save"
        onclick="saveTrackId()"
      >
        Save Tracking ID
      </button>

    </div>

    <div
      id="loader"
      class="loader"
    >
      Saving tracking ID...
    </div>

    <div
      id="toast"
      class="toast"
    ></div>

  </div>

  <script>

    var row = null;

    // ============================================
    // LOAD DATA
    // ============================================

    window.onload = function() {

      google.script.run

        .withSuccessHandler(function(data){

          row = data.row;

          document.getElementById('trackingId').value =
            data.trackingId || '';

          document
            .getElementById('trackingId')
            .focus();

        })

        .withFailureHandler(function(err){

          showToast(
            err.message || 'Failed to load data',
            'error'
          );

        })

        .getTrackingIdData();
    };


    // ============================================
    // ENTER KEY SUPPORT
    // ============================================

    document.addEventListener('keydown', function(e){

      if(e.key === 'Enter'){
        saveTrackId();
      }

    });


    // ============================================
    // SAVE
    // ============================================

    function saveTrackId(){

      if(row === null){
        return;
      }

      var input =
        document.getElementById('trackingId');

      var trackingId =
        input.value.trim();

      // Optional validation
      if(
        trackingId &&
        !/^[A-Za-z]{2}\d{9}[A-Za-z]{2}$/.test(trackingId)
      ){

        showToast(
          'Invalid India Post tracking format',
          'error'
        );

        return;
      }

      toggleLoading(true);

      google.script.run

        .withSuccessHandler(function(msg){

          toggleLoading(false);

          showToast(
            msg || 'Tracking ID saved',
            'success'
          );

          setTimeout(function(){

            google.script.host.close();

          }, 1400);

        })

        .withFailureHandler(function(err){

          toggleLoading(false);

          showToast(
            err.message || 'Failed to save',
            'error'
          );

        })

        .saveTrackingId(
          row,
          trackingId
        );
    }


    // ============================================
    // LOADING STATE
    // ============================================

    function toggleLoading(show){

      document.getElementById('loader').style.display =
        show ? 'block' : 'none';

      document.getElementById('saveBtn').disabled =
        show;
    }


    // ============================================
    // TOAST
    // ============================================

    function showToast(message,type){

      var toast =
        document.getElementById('toast');

      toast.className =
        'toast ' + type;

      toast.textContent =
        message;

      toast.style.display =
        'block';
    }

  </script>

</body>
</html>
