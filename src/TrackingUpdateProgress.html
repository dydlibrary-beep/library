<!DOCTYPE html>
<html>

<head>

  <base target="_top">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>

    *{
      box-sizing:border-box;
    }

    body{

      margin:0;
      padding:24px;

      background:#F8FAFC;

      font-family:'Inter',sans-serif;

      color:#111827;
    }

    .container{

      max-width:460px;
      margin:0 auto;

      background:#FFFFFF;

      border-radius:20px;

      padding:28px;

      border:1px solid #E5E7EB;

      box-shadow:
        0 10px 25px rgba(0,0,0,0.06),
        0 2px 8px rgba(0,0,0,0.04);
    }

    .header{

      display:flex;
      align-items:center;
      gap:14px;

      margin-bottom:24px;
    }

    .icon{

      width:52px;
      height:52px;

      border-radius:16px;

      background:#DBEAFE;

      display:flex;
      align-items:center;
      justify-content:center;

      font-size:26px;
    }

    h2{

      margin:0;

      font-size:20px;
      font-weight:700;

      color:#111827;
    }

    .subtext{

      margin-top:4px;

      font-size:13px;

      color:#6B7280;
    }

    .status-box{

      margin-top:10px;

      padding:14px 16px;

      background:#F9FAFB;

      border:1px solid #E5E7EB;

      border-radius:14px;
    }

    .status-label{

      font-size:12px;
      font-weight:600;

      color:#6B7280;

      margin-bottom:6px;

      text-transform:uppercase;

      letter-spacing:.5px;
    }

    .status-text{

      font-size:15px;
      font-weight:600;

      color:#2563EB;

      min-height:20px;
    }

    .progress-wrapper{

      margin-top:20px;
    }

    .progress-top{

      display:flex;
      justify-content:space-between;
      align-items:center;

      margin-bottom:8px;
    }

    .progress-title{

      font-size:13px;
      font-weight:600;

      color:#374151;
    }

    .progress-percent{

      font-size:13px;
      font-weight:700;

      color:#2563EB;
    }

    .progress-bar{

      width:100%;

      height:14px;

      background:#E5E7EB;

      border-radius:999px;

      overflow:hidden;
    }

    .progress-fill{

      height:100%;

      width:0%;

      background:
        linear-gradient(
          90deg,
          #2563EB,
          #3B82F6
        );

      border-radius:999px;

      transition:width .5s ease;
    }

    .spinner{

      width:18px;
      height:18px;

      border:2px solid rgba(37,99,235,0.2);
      border-top-color:#2563EB;

      border-radius:50%;

      animation:spin .8s linear infinite;

      margin-top:18px;
      margin-left:auto;
      margin-right:auto;
    }

    @keyframes spin{

      to{
        transform:rotate(360deg);
      }
    }

    .buttons{

      display:flex;

      justify-content:flex-end;

      gap:12px;

      margin-top:28px;
    }

    button{

      border:none;

      border-radius:12px;

      padding:12px 18px;

      font-size:14px;

      font-weight:600;

      cursor:pointer;

      transition:all .2s ease;
    }

    button:disabled{

      opacity:.6;

      cursor:not-allowed;
    }

    .cancel-btn{

      background:#EF4444;
      color:#FFFFFF;
    }

    .cancel-btn:hover{

      background:#DC2626;
    }

    .close-btn{

      background:#2563EB;
      color:#FFFFFF;
    }

    .close-btn:hover{

      background:#1D4ED8;
    }

    .success{

      color:#059669 !important;
    }

    .error{

      color:#DC2626 !important;
    }

  </style>

</head>

<body>

  <div class="container">

    <div class="header">

      <div class="icon">
        📬
      </div>

      <div>

        <h2>
          Tracking Update
        </h2>

        <div class="subtext">
          Updating shipment tracking statuses
        </div>

      </div>

    </div>

    <!-- STATUS -->

    <div class="status-box">

      <div class="status-label">
        Current Status
      </div>

      <div
        class="status-text"
        id="statusMsg"
      >
        Initialising...
      </div>

    </div>

    <!-- PROGRESS -->

    <div class="progress-wrapper">

      <div class="progress-top">

        <div class="progress-title">
          Progress
        </div>

        <div
          class="progress-percent"
          id="progressPercent"
        >
          0%
        </div>

      </div>

      <div class="progress-bar">

        <div
          class="progress-fill"
          id="progressFill"
        ></div>

      </div>

    </div>

    <!-- SPINNER -->

    <div
      class="spinner"
      id="spinner"
    ></div>

    <!-- BUTTONS -->

    <div class="buttons">

      <button
        class="cancel-btn"
        id="cancelBtn"
        onclick="cancelTracking()"
      >
        Cancel
      </button>

      <button
        class="close-btn"
        id="closeBtn"
        onclick="google.script.host.close()"
        disabled
      >
        Close
      </button>

    </div>

  </div>

  <script>

    var completed = false;

    // =====================================
    // START PROCESS
    // =====================================

    google.script.run

      .withSuccessHandler(function(){

        pollProgress();

      })

      .withFailureHandler(function(err){

        showError(
          err.message ||
          'Failed to start processing'
        );

      })

      .startTrackingUpdateProcessing();

    // =====================================
    // POLLING
    // =====================================

    function pollProgress(){

      if(completed){
        return;
      }

      google.script.run

        .withSuccessHandler(function(progress){

          updateUI(progress);

          if(!completed){

            setTimeout(
              pollProgress,
              800
            );
          }

        })

        .withFailureHandler(function(err){

          showError(
            err.message ||
            'Progress update failed'
          );

        })

        .getTrackingUpdateProgress();
    }

    // =====================================
    // UPDATE UI
    // =====================================

    function updateUI(progress){

      var statusEl =
        document.getElementById('statusMsg');

      var fill =
        document.getElementById('progressFill');

      var percentText =
        document.getElementById('progressPercent');

      var spinner =
        document.getElementById('spinner');

      var cancelBtn =
        document.getElementById('cancelBtn');

      var closeBtn =
        document.getElementById('closeBtn');

      // Status text

      statusEl.innerText =
        progress.message || 'Processing...';

      // Percent

      var percent = 0;

      if(progress.total > 0){

        percent =
          Math.round(
            (
              progress.current /
              progress.total
            ) * 100
          );
      }

      fill.style.width =
        percent + '%';

      percentText.innerText =
        percent + '%';

      // =================================
      // COMPLETED
      // =================================

      if(
        progress.message.indexOf('Completed') >= 0
      ){

        completed = true;

        statusEl.classList.add('success');

        spinner.style.display = 'none';

        cancelBtn.disabled = true;

        closeBtn.disabled = false;

        fill.style.width = '100%';

        percentText.innerText = '100%';

        return;
      }

      // =================================
      // CANCELLED
      // =================================

      if(
        progress.message.indexOf('Cancelled') >= 0
      ){

        completed = true;

        statusEl.classList.add('error');

        spinner.style.display = 'none';

        cancelBtn.disabled = true;

        closeBtn.disabled = false;

        return;
      }

      // =================================
      // NO ROWS
      // =================================

      if(
        progress.message.indexOf('No rows') >= 0
      ){

        completed = true;

        spinner.style.display = 'none';

        cancelBtn.disabled = true;

        closeBtn.disabled = false;

        return;
      }
    }

    // =====================================
    // CANCEL
    // =====================================

    function cancelTracking(){

      if(completed){
        return;
      }

      var cancelBtn =
        document.getElementById('cancelBtn');

      var statusEl =
        document.getElementById('statusMsg');

      cancelBtn.disabled = true;

      statusEl.innerText =
        'Cancelling...';

      google.script.run
        .cancelTrackingUpdate();
    }

    // =====================================
    // ERROR
    // =====================================

    function showError(message){

      completed = true;

      var statusEl =
        document.getElementById('statusMsg');

      var spinner =
        document.getElementById('spinner');

      var cancelBtn =
        document.getElementById('cancelBtn');

      var closeBtn =
        document.getElementById('closeBtn');

      statusEl.innerText = message;

      statusEl.classList.add('error');

      spinner.style.display = 'none';

      cancelBtn.disabled = true;

      closeBtn.disabled = false;
    }

  </script>

</body>
</html>
