<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #f1f5f9;
      font-family: 'Inter', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.05), 0 10px 10px -5px rgba(0,0,0,0.02);
      padding: 28px;
      width: 400px;
      border: 1px solid #e2e8f0;
      transition: all 0.2s ease;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    .icon-container {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.03);
    }

    .title {
      font-size: 20px;
      font-weight: 700;
      color: #0f172a;
    }

    .subtitle {
      font-size: 13px;
      color: #64748b;
      margin-top: 2px;
    }

    .status-panel {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .status-label {
      text-transform: uppercase;
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .status-value {
      font-size: 15px;
      font-weight: 600;
      color: #2563eb;
      min-height: 22px;
      transition: color 0.3s;
      word-break: break-word;
    }

    .status-value.success {
      color: #059669;
    }

    .status-value.error {
      color: #dc2626;
    }

    .progress-section {
      margin-bottom: 24px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
    }

    .progress-percent {
      font-weight: 700;
      color: #2563eb;
    }

    .progress-track {
      width: 100%;
      height: 10px;
      background: #e2e8f0;
      border-radius: 100px;
      overflow: hidden;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.04);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3b82f6, #2563eb);
      border-radius: 100px;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .progress-fill::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(90deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 80%);
    }

    .spinner-wrapper {
      display: flex;
      justify-content: center;
      margin: 16px 0;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(37, 99, 235, 0.15);
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 8px;
    }

    .btn {
      border: none;
      border-radius: 14px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: 'Inter', sans-serif;
      outline: none;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn-cancel {
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
    }

    .btn-cancel:hover:not(:disabled) {
      background: #fee2e2;
    }

    .btn-primary {
      background: #2563eb;
      color: white;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }

    .btn-primary:hover:not(:disabled) {
      background: #1d4ed8;
    }

    .fade-in {
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="card fade-in">
    <!-- Header -->
    <div class="header">
      <div class="icon-container">📦</div>
      <div>
        <div class="title">Tracking Update</div>
        <div class="subtitle">Updating shipment statuses</div>
      </div>
    </div>

    <!-- Current Status -->
    <div class="status-panel">
      <div class="status-label">Status</div>
      <div class="status-value" id="statusMsg">Initialising...</div>
    </div>

    <!-- Progress Bar -->
    <div class="progress-section">
      <div class="progress-header">
        <span>Progress</span>
        <span class="progress-percent" id="progressPercent">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <!-- Spinner -->
    <div class="spinner-wrapper" id="spinnerContainer">
      <div class="spinner"></div>
    </div>

    <!-- Buttons -->
    <div class="actions">
      <button class="btn btn-cancel" id="cancelBtn" onclick="cancelTracking()">Cancel</button>
      <button class="btn btn-primary" id="closeBtn" onclick="google.script.host.close()" disabled>Close</button>
    </div>
  </div>

  <script>
    let completed = false;

    // Kick off the server-side processing
    google.script.run
      .withSuccessHandler(() => pollProgress())
      .withFailureHandler(err => showError(err.message || 'Failed to start'))
      .startTrackingUpdateProcessing();

    function pollProgress() {
      if (completed) return;

      google.script.run
        .withSuccessHandler(progress => {
          updateUI(progress);
          if (!completed) setTimeout(pollProgress, 800);
        })
        .withFailureHandler(err => showError(err.message || 'Progress check failed'))
        .getTrackingUpdateProgress();
    }

    function updateUI(progress) {
      const statusEl = document.getElementById('statusMsg');
      const fillEl = document.getElementById('progressFill');
      const percentEl = document.getElementById('progressPercent');
      const spinner = document.getElementById('spinnerContainer');
      const cancelBtn = document.getElementById('cancelBtn');
      const closeBtn = document.getElementById('closeBtn');

      // Clean previous states
      statusEl.classList.remove('success', 'error');

      // Set message
      statusEl.textContent = progress.message || 'Processing...';

      // Calculate percentage
      let percent = 0;
      if (progress.total > 0) {
        percent = Math.round((progress.current / progress.total) * 100);
      }
      fillEl.style.width = percent + '%';
      percentEl.textContent = percent + '%';

      // Terminal states
      if (progress.message && progress.message.includes('Completed')) {
        finalize('success');
      } else if (progress.message && progress.message.includes('Cancelled')) {
        finalize('error');
      } else if (progress.message && progress.message.includes('No rows')) {
        finalize(); // neutral
      }
    }

    function finalize(type) {
      completed = true;
      const statusEl = document.getElementById('statusMsg');
      const spinner = document.getElementById('spinnerContainer');
      const cancelBtn = document.getElementById('cancelBtn');
      const closeBtn = document.getElementById('closeBtn');

      spinner.style.display = 'none';
      cancelBtn.disabled = true;
      closeBtn.disabled = false;

      if (type === 'success') {
        statusEl.classList.add('success');
      } else if (type === 'error') {
        statusEl.classList.add('error');
      }
    }

    function cancelTracking() {
      if (completed) return;
      document.getElementById('cancelBtn').disabled = true;
      document.getElementById('statusMsg').textContent = 'Cancelling...';
      google.script.run.cancelTrackingUpdate();
    }

    function showError(message) {
      completed = true;
      document.getElementById('statusMsg').textContent = message;
      document.getElementById('statusMsg').classList.add('error');
      document.getElementById('spinnerContainer').style.display = 'none';
      document.getElementById('cancelBtn').disabled = true;
      document.getElementById('closeBtn').disabled = false;
    }
  </script>
</body>
</html>
