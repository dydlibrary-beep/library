
<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    body {
      margin: 0;
      padding: 18px;
      background: transparent;
      overflow: hidden;
      width: 100%;
      height: auto;
    }
    .toast {
      position: relative;
      width: 100%;
      max-width: 460px;
      padding: 18px 20px 20px;
      border-radius: 20px;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      color: white;
      backdrop-filter: blur(18px);
      box-shadow: 0 12px 35px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.12);
      animation: popupIn .35s cubic-bezier(.2,.9,.2,1);
      overflow: hidden;
    }
    .success {
      background: linear-gradient(135deg, rgba(22,163,74,.96), rgba(21,128,61,.92));
    }
    .error {
      background: linear-gradient(135deg, rgba(220,38,38,.96), rgba(153,27,27,.92));
    }
    .warning {
      background: linear-gradient(135deg, rgba(245,158,11,.97), rgba(217,119,6,.94));
      color: #111827;
    }
    .info {
      background: linear-gradient(135deg, rgba(37,99,235,.96), rgba(29,78,216,.92));
    }
    .icon {
      width: 44px;
      height: 44px;
      min-width: 44px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,.16);
      font-size: 22px;
      box-shadow: inset 0 1px 2px rgba(255,255,255,.25);
    }
    .content {
      flex: 1;
      min-width: 0;
    }
    .title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 5px;
      letter-spacing: .2px;
    }
    .message {
      font-size: 14px;
      line-height: 1.6;
      opacity: .96;
      word-break: break-word;
    }
    .close {
      cursor: pointer;
      font-size: 18px;
      opacity: .8;
      transition: .2s;
      padding-left: 6px;
      flex-shrink: 0;
    }
    .close:hover {
      opacity: 1;
      transform: scale(1.08);
    }
    .progress {
      position: absolute;
      left: 0;
      bottom: 0;
      height: 4px;
      width: 100%;
      background: rgba(255,255,255,.22);
      overflow: hidden;
    }
    .progress::after {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 100%;
      background: rgba(255,255,255,.85);
      animation: timer 4s linear forwards;
    }
    @keyframes popupIn {
      from { opacity: 0; transform: translateY(-20px) scale(.92); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes popupOut {
      to { opacity: 0; transform: translateY(-12px) scale(.96); }
    }
    @keyframes timer {
      from { width: 100%; }
      to   { width: 0%; }
    }
  </style>
</head>
<body>
  <div class="toast <?= type ?>" id="toast">
    <div class="icon"><?= icon ?></div>
    <div class="content">
      <div class="title">
        <? if (type === "success") { ?>
          Success
        <? } else if (type === "error") { ?>
          Error
        <? } else if (type === "warning") { ?>
          Warning
        <? } else { ?>
          Information
        <? } ?>
      </div>
      <!-- This is the ONLY place the actual message appears -->
      <div class="message"><?= message ?></div>
    </div>
    <div class="close" onclick="closeToast()">✕</div>
    <div class="progress"></div>
  </div>

  <script>
    var toast = document.getElementById("toast");
    function closeToast() {
      toast.style.animation = "popupOut .25s ease forwards";
      setTimeout(function() {
        google.script.host.close();
      }, 250);
    }
    setTimeout(closeToast, 4000);
  </script>
</body>
</html>
